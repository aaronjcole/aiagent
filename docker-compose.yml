# ---------------------------------------------------------------------------
# Local-stack for the agentic email automation system.
#
#   docker compose up
#
# brings up Postgres + Temporal (+ Temporal UI) + the API server + the worker.
# All app config comes from the local `.env` (copy from `.env.example`; it is
# git-ignored and contains placeholders only). Non-secret dev defaults are
# baked in below so the stack boots even with a bare `.env`.
#
# Service / port summary:
#   postgres     5432   Postgres 16 (app DB + Temporal DBs)
#   temporal     7233   Temporal frontend (gRPC)
#   temporal-ui  8080   Temporal Web UI (http://localhost:8080)
#   api          3001   Fastify HTTP API  (API_PORT)
#   worker       --     Temporal worker (no exposed port)
#   admin        3000   Next.js admin UI  (ADMIN_PORT, optional)
# ---------------------------------------------------------------------------

name: aiagent

services:
  # -------------------------------------------------------------------------
  # Postgres — backs both the application and Temporal.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiagent}
      POSTGRES_DB: ${POSTGRES_DB:-aiagent}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the `temporal` + `temporal_visibility` databases on first init.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiagent} -d ${POSTGRES_DB:-aiagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aiagent

  # -------------------------------------------------------------------------
  # Temporal server (auto-setup bundles server + schema setup against Postgres).
  # -------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aiagent}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-aiagent}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - aiagent

  # -------------------------------------------------------------------------
  # Temporal Web UI (optional, but handy for inspecting workflow runs).
  # -------------------------------------------------------------------------
  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"
    networks:
      - aiagent

  # -------------------------------------------------------------------------
  # API server — Fastify HTTP API + Temporal client.
  # Build context is the repo root so the whole pnpm workspace is installable.
  # Runs Prisma migrations, then starts the server.
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Point at the in-network services (override .env's localhost values).
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiagent}:${POSTGRES_PASSWORD:-aiagent}@postgres:5432/${POSTGRES_DB:-aiagent}?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      # Safe-by-default providers + kill switches.
      LLM_PROVIDER: mock
      EMAIL_PROVIDER: mock
      CALENDAR_PROVIDER: mock
      RESEARCH_PROVIDER: mock
      AUTO_SEND_ENABLED: "false"
      SENDING_ENABLED: "false"
      API_PORT: ${API_PORT:-3001}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    # Apply migrations against the running Postgres, then boot the API. The
    # Dockerfile defines the real entrypoint/build; this just sequences startup.
    command:
      - sh
      - -c
      - >-
        pnpm --filter @app/db exec prisma migrate deploy &&
        node apps/api/dist/index.js
    # Healthy only after migrations have run and the HTTP server is up. The
    # worker depends on this so it never starts before the schema exists. Uses
    # the always-present `node` runtime (the slim image has no curl/wget).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:'+(process.env.API_PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - aiagent

  # -------------------------------------------------------------------------
  # Temporal worker — hosts the workflows + activities on the `aiagent` queue.
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiagent}:${POSTGRES_PASSWORD:-aiagent}@postgres:5432/${POSTGRES_DB:-aiagent}?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      LLM_PROVIDER: mock
      EMAIL_PROVIDER: mock
      CALENDAR_PROVIDER: mock
      RESEARCH_PROVIDER: mock
      AUTO_SEND_ENABLED: "false"
      SENDING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      # The API runs `prisma migrate deploy` before becoming healthy; waiting
      # for service_healthy guarantees the schema exists before the worker boots.
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - node apps/worker/dist/index.js
    networks:
      - aiagent

  # -------------------------------------------------------------------------
  # Admin UI (Next.js) — optional. Comment out if apps/admin/Dockerfile is not
  # yet present. Talks to the API service for its data.
  # -------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiagent}:${POSTGRES_PASSWORD:-aiagent}@postgres:5432/${POSTGRES_DB:-aiagent}?schema=public
      ADMIN_PORT: ${ADMIN_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-3001}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "${ADMIN_PORT:-3000}:${ADMIN_PORT:-3000}"
    networks:
      - aiagent

volumes:
  postgres-data:

networks:
  aiagent:
    driver: bridge
